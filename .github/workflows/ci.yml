name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/ingestion-api/pom.xml

      - name: Verify ingestion API
        run: mvn --batch-mode --file services/ingestion-api/pom.xml clean verify

  python:
    name: Python and Spark tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 for Spark
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python project and test dependencies
        run: python -m pip install -e "./python[streaming,dev]"

      - name: Run Ruff
        run: ruff check python/

      - name: Run Python, Spark, and analytics tests
        run: python -m pytest -q python/tests

  docker:
    name: Build ingestion API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - java
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate k6 benchmark script
        run: >-
          docker run --rm
          --volume "$PWD/load-tests:/scripts:ro"
          grafana/k6:0.55.0
          inspect /scripts/ingestion.js

      - name: Build image
        run: >-
          docker build
          --file services/ingestion-api/Dockerfile
          --tag pulseflow-ingestion
          services/ingestion-api
