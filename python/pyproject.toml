[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseflow"
version = "0.1.0"
description = "Synthetic event generator for the PulseFlow data platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
pulseflow-generate = "pulseflow.generator:main"

[project.optional-dependencies]
streaming = [
    "pyspark==4.2.0",
]
ml = [
    "mlflow>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulseflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
