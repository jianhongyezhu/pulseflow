name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/ingestion-api/pom.xml

      - name: Verify ingestion API
        run: mvn --batch-mode --file services/ingestion-api/pom.xml clean verify

  python:
    name: Python and Spark tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21 for Spark
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python project and test dependencies
        run: python -m pip install -e "./python[streaming,dev]"

      - name: Run Ruff
        run: ruff check python/

      - name: Run Python, Spark, and analytics tests
        run: python -m pytest -q python/tests

  docker:
    name: Build ingestion API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - java
      - python
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: >-
          docker build
          --file services/ingestion-api/Dockerfile
          --tag pulseflow-ingestion
          services/ingestion-api
