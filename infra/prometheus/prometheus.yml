global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ingestion-api:8080

  - job_name: spark-streaming
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9108
