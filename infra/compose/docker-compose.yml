
name: pulseflow

services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker

    ports:
      - "127.0.0.1:${PULSEFLOW_KAFKA_HOST_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:${PULSEFLOW_KAFKA_HOST_PORT:-9092}"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingestion-api:
    image: pulseflow-ingestion
    build:
      context: ../../services/ingestion-api
    ports:
      - "127.0.0.1:${PULSEFLOW_API_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      PULSEFLOW_TOPIC: ${PULSEFLOW_TOPIC:-user-behaviour.v1}
    depends_on:
      broker:
        condition: service_healthy

  k6:
    image: grafana/k6:0.55.0
    profiles: ["loadtest"]
    command: ["run", "/scripts/ingestion.js"]
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://ingestion-api:8080}
      K6_PROFILE: ${K6_PROFILE:-arrival}
      K6_RATE: ${K6_RATE:-50}
      K6_PROFILE_DURATION: ${K6_PROFILE_DURATION:-60s}
      K6_PRE_ALLOCATED_VUS: ${K6_PRE_ALLOCATED_VUS:-50}
      K6_MAX_VUS: ${K6_MAX_VUS:-150}
      RUN_ID: ${RUN_ID:-local}
      K6_SUMMARY_PATH: /artifacts/k6-summary.json
    volumes:
      - ../../load-tests:/scripts:ro
      - ${PULSEFLOW_ARTIFACTS_DIR:-../../artifacts/performance}:/artifacts
    depends_on:
      - ingestion-api

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - ingestion-api

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      PULSEFLOW_GRAFANA_DATASOURCE_URL: http://prometheus:9090
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" ||
        { echo "Set GRAFANA_ADMIN_PASSWORD before starting the observability profile." >&2; exit 1; };
        exec /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/pulseflow.yml:ro
      - ../grafana/provisioning/dashboards/pulseflow.yml:/etc/grafana/provisioning/dashboards/pulseflow.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
